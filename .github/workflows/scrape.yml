name: Tradetron Live Pulse

on:
  schedule:
    - cron: '*/10 3-10 * * 1-5' # Runs every 10 mins during Indian Market Hours (Mon-Fri)
  workflow_dispatch: # Allows you to run it manually

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install chromium

      - name: Run Robot Brain
        env:
          TT_EMAIL: ${{ secrets.TT_EMAIL }}
          TT_PASSWORD: ${{ secrets.TT_PASSWORD }}
        run: python scraper.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "Robot-Secretary"
          git config --global user.email "bot@github.com"
          git add data.json
          git commit -m "Update Live P&L: $(date)" || exit 0
          git push
