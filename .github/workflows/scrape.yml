name: Tradetron Live Pulse

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run Robot Brain
        env:
          TT_EMAIL: ${{ secrets.TT_EMAIL }}
          TT_PASSWORD: ${{ secrets.TT_PASSWORD }}
        run: python scraper.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "Robot-Secretary"
          git config --global user.email "bot@github.com"
          git add data.json step1_dashboard.png step2_deployed.png step3_lite.png fatal_error.png page_debug.html || exit 0
          git commit -m "Drill Update: $(date)" || exit 0
          git push
