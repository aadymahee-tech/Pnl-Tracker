name: Tradetron Live Pulse

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # CRITICAL: This allows the bot to save data.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # Updated version

      - name: Setup Python
        uses: actions/setup-python@v5 # Updated version
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium # CRITICAL: Installs required Linux libraries

      - name: Run Robot Brain
        env:
          TT_EMAIL: ${{ secrets.TT_EMAIL }}
          TT_PASSWORD: ${{ secrets.TT_PASSWORD }}
        run: python scraper.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "Robot-Secretary"
          git config --global user.email "bot@github.com"
          git add data.json
          git commit -m "Update Live P&L: $(date)" || exit 0
          git push
